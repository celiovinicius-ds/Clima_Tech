name: Atualização Diária ClimaTech

on:
  schedule:
    # 09:00 UTC corresponde exatamente às 06:00 (UTC-3 - Horário de Brasília)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite disparar o robô manualmente pelo GitHub quando quiser testar

jobs:
  executar-atualizacao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v3

      - name: Configurar Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar script diário
        run: |
          python etl/atualizar_dia.py

      - name: Salvar dados atualizados no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.parquet
          git commit -m "chore(dados): atualização automática diária [skip ci]" || exit 0
          git push